<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Контакты Артёма — напишите через форму обратной связи">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.web3forms.com; form-action 'self'; object-src 'none'; base-uri 'self'">
    <title>Артём — портфолио | Контакты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <h1 class="logo">Артём</h1>
            <nav class="main-nav" aria-label="Основная навигация">
                <ul>
                    <li><a href="index.html" class="nav-link">Главная</a></li>
                    <li><a href="about.html" class="nav-link">Обо мне</a></li>
                    <li><a href="contacts.html" class="nav-link active">Контакты</a></li>
                </ul>
            </nav>
            <button id="theme-toggle" class="theme-toggle" aria-label="Переключить тему">
                <span class="theme-icon">🌙</span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <section class="contacts-section">
            <div class="container">
                <h2>Связаться со мной</h2>
                <form id="contact-form" class="contact-form" novalidate>
                    <!-- Access key из личного кабинета Web3Forms: замените на свой -->
                    <input type="hidden" name="access_key" value="ВСТАВЬ_СВОЙ_КЛЮЧ_СЮДА">

                    <!-- Honeypot: люди этого поля не видят, а боты его отмечают -->
                    <input type="checkbox" name="botcheck" id="botcheck" class="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">

                    <div class="form-group">
                        <label for="name">Имя <span class="required">*</span></label>
                        <input type="text" id="name" name="name" placeholder="Ваше имя" required>
                        <span class="error-message" id="name-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                        <span class="error-message" id="email-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="subject">Тема</label>
                        <select id="subject" name="subject">
                            <option value="">Выберите тему</option>
                            <option value="collaboration">Сотрудничество</option>
                            <option value="job">Работа</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Сообщение <span class="required">*</span></label>
                        <textarea id="message" name="message" rows="5" placeholder="Ваше сообщение..." required></textarea>
                        <span class="error-message" id="message-error"></span>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Отправить</button>
                        <button type="reset" class="btn btn-secondary">Очистить</button>
                    </div>

                    <div id="form-success" class="form-success" role="alert"></div>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>&copy; 2026 Артём</p>
            <p class="footer-info">Сделано с ❤️</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
